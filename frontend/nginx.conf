map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # Resolve again after backend is recreated or Docker Desktop restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $wms_backend backend:8000;
    set $orchestrator ${ORCHESTRATOR_HOST}:${ORCHESTRATOR_PORT};

    location /api/ {
        proxy_pass http://$wms_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location = /control-tower-api/receive-status {
        proxy_pass http://$wms_backend/api/v1/receive-status$is_args$args;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # QR tablet's separate orchestrator remains on the Windows host.
    location /task/ {
        proxy_pass http://$orchestrator$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
