<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Phiếu sản phẩm - Bacviet</title>
  <!--
    Template in phiếu sản phẩm Bacviet — 9 phiếu / trang A4 (3 cột × 3 hàng).

    Backend / FE truyền dữ liệu qua window.__BACVIET_PRINT_DATA__ rồi gọi BacvietPrint.init().

    Payload:
    {
      "quantity": 9,              // số phiếu cần in
      "part_number": "RC6-...",     // mã sản phẩm (dùng chung)
      "part_name": "TN_SP_...",     // tên sản phẩm (dùng chung)
      "qr_ids": ["id-1", "..."]   // mỗi phần tử = 1 QR id riêng, length = quantity
    }

    Số trang = Math.ceil(quantity / 9)
    In PDF: Scale 100%, margin theo @page.
  -->
  <style>
    /* ── Biến layout (chỉnh kích thước tại đây) ── */
    :root {
      --page-width: 194mm;
      --page-height: 281mm;
      --page-margin: 7mm;
      --labels-per-page: 9;
      --label-cols: 3;
      --label-rows: 3;
      --sheet-padding: 3mm;
      --sheet-gap: 2.5mm;
      --label-col-width: 16.5mm;
      --label-width: calc(
        (var(--page-width) - 2 * var(--sheet-padding) - (var(--label-cols) - 1) * var(--sheet-gap))
        / var(--label-cols)
      );
      --label-height: calc(
        (var(--page-height) - 2 * var(--sheet-padding) - (var(--label-rows) - 1) * var(--sheet-gap))
        / var(--label-rows)
      );
    }

    @page {
      size: A4 portrait;
      margin: var(--page-margin);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 8mm;
      font-family: "Times New Roman", Times, serif;
      color: #000;
      background: #f3f4f6;
    }

    .toolbar {
      max-width: calc(var(--page-width) + 16mm);
      margin: 0 auto 6mm;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #475569;
    }

    .toolbar button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
    }

    .print-root {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10mm;
    }

    .print-root.is-empty {
      min-height: 40mm;
      justify-content: center;
      color: #64748b;
      font-size: 14px;
    }

    /* ── Trang A4 ── */
    .sheet-page {
      width: var(--page-width);
      height: var(--page-height);
      background: #fff;
      padding: var(--sheet-padding);
      display: grid;
      grid-template-columns: repeat(var(--label-cols), var(--label-width));
      grid-template-rows: repeat(var(--label-rows), var(--label-height));
      gap: var(--sheet-gap);
      justify-content: center;
      align-content: center;
      page-break-after: always;
      break-after: page;
    }

    .sheet-page:last-child {
      page-break-after: auto;
      break-after: auto;
    }

    /* ── Một phiếu ── */
    .ticket {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      border: 1px solid #000;
      background: #fff;
      display: flex;
      flex-direction: column;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .ticket-header {
      border-bottom: 1px solid #000;
      flex-shrink: 0;
    }

    .ticket-title {
      padding: 0.5mm 0.8mm;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .ticket-title h1 {
      margin: 0;
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1.05;
    }

    .ticket-title p {
      margin: 0;
      font-size: 7.5px;
      font-style: italic;
      font-weight: 700;
      line-height: 1.05;
    }

    .ticket-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* ── Dòng label | value — hơi thấp hơn, giữ cỡ chữ ── */
    .row {
      display: grid;
      grid-template-columns: var(--label-col-width) 1fr;
      border-bottom: 1px solid #000;
      flex: 0.85 1 0;
      min-height: 4.6mm;
      align-items: stretch;
    }

    .label {
      padding: 0.3mm 0.45mm;
      border-right: 1px solid #000;
      font-size: 7.5px;
      line-height: 1.1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .label em {
      display: block;
      font-style: italic;
      font-size: 6.5px;
    }

    .value {
      padding: 0.3mm 0.45mm;
      font-size: 8px;
      font-weight: 600;
      line-height: 1.15;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
    }

    /* ── Hàng cân nặng / người làm (3 cột) ── */
    .footer-row {
      display: grid;
      grid-template-columns: var(--label-col-width) 1fr 1fr;
      border-bottom: 1px solid #000;
      flex: 0.95 1 0;
      min-height: 6.5mm;
    }

    .footer-row > div {
      padding: 0.3mm 0.45mm;
      border-right: 1px solid #000;
      font-size: 7px;
      line-height: 1.1;
    }

    .footer-row > div:last-child { border-right: none; }

    .footer-row .weight-fill,
    .footer-row .sign-line {
      margin-top: 0.35mm;
      border-bottom: 1px dashed #000;
      min-height: 2.8mm;
    }

    /* ── Ghi chú + QR: QR cách lề + chỗ cho mã preview ── */
    .remarks-row {
      flex: 0 0 22mm;
      height: 22mm;
      max-height: 22mm;
      min-height: 0;
      display: grid;
      grid-template-columns: var(--label-col-width) 1fr 1fr;
      border-bottom: 1px solid #000;
      overflow: hidden;
    }

    .remarks-content {
      grid-column: 1 / 3;
      padding: 0.3mm 0.4mm;
      font-size: 6.5px;
      line-height: 1.1;
      border-right: 1px solid #000;
    }

    .remarks-content em {
      font-style: italic;
      font-size: 5.5px;
    }

    .remarks-body {
      margin-top: 0.2mm;
      min-height: 0;
      font-size: 6.5px;
    }

    .ticket-qr {
      grid-column: 3;
      padding: 0.7mm 0.7mm 0.4mm;
      margin: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) 3.2mm;
      gap: 0.3mm;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      align-items: center;
      justify-items: center;
    }

    .ticket-qr img {
      width: calc(100% - 0.4mm);
      height: calc(100% - 0.4mm);
      max-width: 100%;
      max-height: 100%;
      margin: 0;
      padding: 0;
      object-fit: contain;
      display: block;
    }

    .ticket-qr .qr-text {
      margin: 0;
      padding: 0 0.2mm;
      width: 100%;
      height: 3.2mm;
      font-size: 4px;
      word-break: break-all;
      line-height: 1.05;
      text-align: center;
      overflow: hidden;
      align-self: end;
    }

    /* ── Meta cố định trên form ── */
    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 6px;
      padding: 0.35mm 0.45mm 0.45mm;
      flex-shrink: 0;
    }

    @media print {
      body {
        padding: 0;
        background: #fff;
      }
      .toolbar { display: none; }
      .print-root { gap: 0; }
      .print-root.is-empty { display: none; }
      .sheet-page {
        box-shadow: none;
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span id="page-info">Chưa có dữ liệu in</span>
    <button type="button" id="toolbar-print-btn">In / Lưu PDF</button>
  </div>

  <div class="print-root is-empty" id="print-root">Chưa có dữ liệu in.</div>

  <!-- Mock preview: mở file với ?mock=1 hoặc chạy scripts/mock_print_export.py -->
<script>window.__BACVIET_PRINT_DATA__ = {"mode": "preview", "__mock": true, "item_id": 1, "quantity": 9, "part_number": "BGRD00074", "part_name": "Thùng carton trà Bupnon TEA365 ô long vị đào (QR) 450ml", "qr_ids": ["BGRD00074-20260821-00000001", "BGRD00074-20260821-00000002", "BGRD00074-20260821-00000003", "BGRD00074-20260821-00000004", "BGRD00074-20260821-00000005", "BGRD00074-20260821-00000006", "BGRD00074-20260821-00000007", "BGRD00074-20260821-00000008", "BGRD00074-20260821-00000009"], "display_codes": ["BGRD00074-20260821", "BGRD00074-20260821", "BGRD00074-20260821", "BGRD00074-20260821", "BGRD00074-20260821", "BGRD00074-20260821", "BGRD00074-20260821", "BGRD00074-20260821", "BGRD00074-20260821"]};</script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      if (params.get("mock") !== "1" && !window.__BACVIET_PRINT_DATA__) return;
      window.__BACVIET_PRINT_DATA__ = window.__BACVIET_PRINT_DATA__ || {
        __mock: true,
        mode: "preview",
        item_id: 1,
        quantity: 9,
        part_number: "BGRD00074",
        part_name: "Thùng carton trà Bupnon TEA365 ô long vị đào (QR) 450ml",
        qr_ids: [
          "BGRD00074-20260821-00000001",
          "BGRD00074-20260821-00000002",
          "BGRD00074-20260821-00000003",
          "BGRD00074-20260821-00000004",
          "BGRD00074-20260821-00000005",
          "BGRD00074-20260821-00000006",
          "BGRD00074-20260821-00000007",
          "BGRD00074-20260821-00000008",
          "BGRD00074-20260821-00000009",
        ],
        display_codes: Array(9).fill("BGRD00074-20260821"),
      };
    })();
  </script>

  <!--
    BACKEND (Jinja2 ví dụ):
    <script>window.__BACVIET_PRINT_DATA__ = {{ payload | tojson }};</script>
  -->

  <script>
    (function () {
      "use strict";

      /** Số phiếu trên mỗi trang A4 — đồng bộ với --labels-per-page trong CSS */
      const LABELS_PER_PAGE = 9;

      /** Mã biểu mẫu in trên form (không truyền từ backend) */
      const DOCUMENT_CODE = "PR-QĐ01-BM12-R00";

      /* ── Utils ── */

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function qrImageUrl(qrId) {
        return (
          "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" +
          encodeURIComponent(String(qrId ?? ""))
        );
      }

      /**
       * Chuyển payload backend → danh sách phiếu.
       *
       * @param {{ quantity?: number, part_number?: string, part_name?: string, qr_ids?: string[] }} data
       * @returns {{ part_number: string, part_name: string, qr_id: string }[]}
       */
      function buildLabels(data) {
        const quantity = Math.max(Number(data?.quantity) || 0, 0);
        const partNumber = String(data?.part_number ?? "");
        const partName = String(data?.part_name ?? "");
        const qrIds = Array.isArray(data?.qr_ids) ? data.qr_ids : [];
        const displayCodes = Array.isArray(data?.display_codes) ? data.display_codes : [];

        return Array.from({ length: quantity }, (_, index) => ({
          part_number: partNumber,
          part_name: partName,
          qr_id: String(qrIds[index] ?? ""),
          qr_display: String(displayCodes[index] ?? qrIds[index] ?? ""),
        }));
      }

      /** @param {number} quantity */
      function countPages(quantity) {
        const total = Math.max(Number(quantity) || 0, 0);
        return total === 0 ? 0 : Math.ceil(total / LABELS_PER_PAGE);
      }

      /* ── Render ── */

      /**
       * @param {{ part_number: string, part_name: string, qr_id: string }} label
       */
      function renderTicket(label) {
        const partNumber = escapeHtml(label.part_number);
        const partName = escapeHtml(label.part_name);
        const qrId = escapeHtml(label.qr_id);
        const qrDisplay = escapeHtml(label.qr_display);  

        return `
          <div class="ticket">
            <div class="ticket-header">
              <div class="ticket-title">
                <h1>Phiếu sản phẩm</h1>
                <p>Product record sheet</p>
              </div>
            </div>

            <div class="ticket-body">
              <div class="row">
                <div class="label">Mã sản phẩm<em>Part number</em></div>
                <div class="value">${partNumber}</div>
              </div>
              <div class="row">
                <div class="label">Tên sản phẩm<em>Part name</em></div>
                <div class="value">${partName}</div>
              </div>
              <div class="row">
                <div class="label">Số lượng<em>Quantity</em></div>
                <div class="value"></div>
              </div>
              <div class="row">
                <div class="label">Sản xuất<em>Production</em></div>
                <div class="value"></div>
              </div>
              <div class="row">
                <div class="label">Kiểm tra<em>Inspection</em></div>
                <div class="value"></div>
              </div>
              <div class="row">
                <div class="label">Đóng gói<em>Packing</em></div>
                <div class="value"></div>
              </div>

              <div class="footer-row">
                <div>
                  Cân nặng tiêu chuẩn:<br />
                </div>
                <div>
                  Cân nặng thực tế:
                  <div class="weight-fill"></div>
                </div>
                <div>
                  Người làm / <em>Operator</em>
                  <div class="sign-line"></div>
                </div>
              </div>

              <div class="remarks-row">
                <div class="remarks-content">
                  Ghi chú (<em>Remarks</em>):
                  <div class="remarks-body"></div>
                </div>
                <div class="ticket-qr">
                  <img src="${qrImageUrl(label.qr_id)}" alt="${qrDisplay}" />
                  <div class="qr-text">${qrDisplay}</div>
                </div>
              </div>

              <div class="meta">
                <span>Ngày ban hành:</span>
                <span>${DOCUMENT_CODE}</span>
              </div>
            </div>
          </div>
        `;
      }

      /**
       * @param {{ part_number: string, part_name: string, qr_id: string }[]} labels
       * @returns {string}
       */
      function renderPages(labels) {
        if (!labels.length) return "";

        const pages = [];
        for (let i = 0; i < labels.length; i += LABELS_PER_PAGE) {
          const chunk = labels.slice(i, i + LABELS_PER_PAGE);
          pages.push(
            `<div class="sheet-page">${chunk.map(renderTicket).join("")}</div>`,
          );
        }
        return pages.join("");
      }

      function updatePageInfo(labelCount) {
        const pageInfo = document.getElementById("page-info");
        if (!pageInfo) return;

        if (labelCount === 0) {
          pageInfo.textContent = "Chưa có dữ liệu in";
          return;
        }

        const pages = countPages(labelCount);
        pageInfo.textContent =
          `${labelCount} phiếu · ${pages} trang A4 (${LABELS_PER_PAGE} phiếu/trang)`;
      }

      /**
       * Render template vào #print-root.
       * @param {{ quantity?: number, part_number?: string, part_name?: string, qr_ids?: string[] }} data
       * @returns {{ labels: object[], pageCount: number, html: string }}
       */
      function init(data) {
        const labels = buildLabels(data);
        const html = renderPages(labels);
        const root = document.getElementById("print-root");

        if (root) {
          root.classList.toggle("is-empty", labels.length === 0);
          root.innerHTML = labels.length === 0 ? "Chưa có dữ liệu in." : html;
        }

        updatePageInfo(labels.length);

        return {
          labels,
          pageCount: countPages(labels.length),
          html,
        };
      }

      /* ── Public API ── */

      window.BacvietPrint = {
        LABELS_PER_PAGE,
        DOCUMENT_CODE,
        buildLabels,
        countPages,
        renderTicket,
        renderPages,
        init,
      };

      /** @deprecated Dùng BacvietPrint.renderPages(BacvietPrint.buildLabels(data)) */
      window.renderBacvietPrint = function renderBacvietPrint(data) {
        return renderPages(buildLabels(data));
      };

      window.LABELS_PER_PAGE = LABELS_PER_PAGE;

      function handleToolbarPrint() {
        const data = window.__BACVIET_PRINT_DATA__;
        if (data?.mode === "preview" && window.parent && window.parent !== window) {
          window.parent.postMessage(
            {
              type: "bacviet-qr-print",
              item_id: data.item_id,
              quantity: data.quantity,
            },
            "*",
          );
          return;
        }
        window.print();
      }

      document
        .getElementById("toolbar-print-btn")
        ?.addEventListener("click", handleToolbarPrint);

      if (window.__BACVIET_PRINT_DATA__) {
        init(window.__BACVIET_PRINT_DATA__);
      }
    })();
  </script>
</body>
</html>
