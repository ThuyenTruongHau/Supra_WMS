<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Phiếu di chuyển</title>
  <!--
    Template in phiếu di chuyển — 9 phiếu / trang A4 (3 cột × 3 hàng).
    Tham chiếu layout Bacviet; thêm chỗ QR cạnh ghi chú.

    Backend / FE truyền dữ liệu qua window.__TRANSFER_PRINT_DATA__ rồi gọi TransferPrint.init().

    Payload:
    {
      "quantity": 9,
      "part_number": "RC6-1377-000",
      "part_name": "TN_SP_Holder_L_K2",
      "cavity": "",                 // tùy chọn, điền sẵn nếu có
      "qr_ids": ["id-1", "..."],  // length = quantity
      "display_codes": ["..."]    // tùy chọn, hiện dưới QR
    }

    Số trang = Math.ceil(quantity / 9)
    In PDF: Scale 100%, margin theo @page.
    Phiếu màu Vàng (ghi chú quy trình).
  -->
  <style>
    /* ── Biến layout (đồng bộ Bacviet / mock_print_layout) ── */
    :root {
      --page-width: 194mm;
      --page-height: 281mm;
      --page-margin: 7mm;
      --labels-per-page: 9;
      --label-cols: 3;
      --label-rows: 3;
      --sheet-padding: 3mm;
      --sheet-gap: 2.5mm;
      --label-col-width: 16.5mm;
      --label-width: calc(
        (var(--page-width) - 2 * var(--sheet-padding) - (var(--label-cols) - 1) * var(--sheet-gap))
        / var(--label-cols)
      );
      --label-height: calc(
        (var(--page-height) - 2 * var(--sheet-padding) - (var(--label-rows) - 1) * var(--sheet-gap))
        / var(--label-rows)
      );
    }

    @page {
      size: A4 portrait;
      margin: var(--page-margin);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 8mm;
      font-family: "Times New Roman", Times, serif;
      color: #000;
      background: #f3f4f6;
    }

    .toolbar {
      max-width: calc(var(--page-width) + 16mm);
      margin: 0 auto 6mm;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #475569;
    }

    .toolbar button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
    }

    .print-root {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10mm;
    }

    .print-root.is-empty {
      min-height: 40mm;
      justify-content: center;
      color: #64748b;
      font-size: 14px;
    }

    /* ── Trang A4 ── */
    .sheet-page {
      width: var(--page-width);
      height: var(--page-height);
      background: #fff;
      padding: var(--sheet-padding);
      display: grid;
      grid-template-columns: repeat(var(--label-cols), var(--label-width));
      grid-template-rows: repeat(var(--label-rows), var(--label-height));
      gap: var(--sheet-gap);
      justify-content: center;
      align-content: center;
      page-break-after: always;
      break-after: page;
    }

    .sheet-page:last-child {
      page-break-after: auto;
      break-after: auto;
    }

    /* ── Một phiếu ── */
    .ticket {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      border: 1px solid #000;
      background: #fff;
      display: flex;
      flex-direction: column;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .ticket-header {
      border-bottom: 1px solid #000;
      flex-shrink: 0;
    }

    .ticket-title {
      padding: 0.8mm 0.8mm;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .ticket-title h1 {
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .ticket-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* ── Dòng label | value ── */
    .row {
      display: grid;
      grid-template-columns: var(--label-col-width) 1fr;
      border-bottom: 1px solid #000;
      flex: 0.9 1 0;
      min-height: 5.2mm;
      align-items: stretch;
    }

    .label {
      padding: 0.35mm 0.5mm;
      border-right: 1px solid #000;
      font-size: 7.5px;
      line-height: 1.15;
      display: flex;
      align-items: center;
    }

    .value {
      padding: 0.35mm 0.5mm;
      font-size: 8.5px;
      font-weight: 600;
      line-height: 1.15;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
    }

    /* ── Ghi chú + QR ── */
    .remarks-row {
      flex: 0 0 24mm;
      height: 24mm;
      max-height: 24mm;
      min-height: 0;
      display: grid;
      grid-template-columns: var(--label-col-width) 1fr 1fr;
      border-bottom: 1px solid #000;
      overflow: hidden;
    }

    .remarks-content {
      grid-column: 1 / 3;
      padding: 0.4mm 0.5mm;
      font-size: 7px;
      line-height: 1.15;
      border-right: 1px solid #000;
    }

    .remarks-hint {
      margin-top: 1.2mm;
      font-size: 7.5px;
      letter-spacing: 0.04em;
    }

    .remarks-body {
      margin-top: 0.8mm;
      min-height: 8mm;
    }

    .ticket-qr {
      grid-column: 3;
      padding: 0.8mm 0.8mm 0.4mm;
      margin: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) 3.2mm;
      gap: 0.3mm;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      align-items: center;
      justify-items: center;
    }

    .ticket-qr img {
      width: calc(100% - 0.4mm);
      height: calc(100% - 0.4mm);
      max-width: 100%;
      max-height: 100%;
      margin: 0;
      padding: 0;
      object-fit: contain;
      display: block;
    }

    .ticket-qr .qr-text {
      margin: 0;
      padding: 0 0.2mm;
      width: 100%;
      height: 3.2mm;
      font-size: 4px;
      word-break: break-all;
      line-height: 1.05;
      text-align: center;
      overflow: hidden;
      align-self: end;
    }

    /* ── Meta cố định trên form ── */
    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 6px;
      padding: 0.4mm 0.5mm 0.5mm;
      flex-shrink: 0;
    }

    @media print {
      body {
        padding: 0;
        background: #fff;
      }
      .toolbar { display: none; }
      .print-root { gap: 0; }
      .print-root.is-empty { display: none; }
      .sheet-page {
        box-shadow: none;
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span id="page-info">Chưa có dữ liệu in</span>
    <button type="button" id="toolbar-print-btn">In / Lưu PDF</button>
  </div>

  <div class="print-root is-empty" id="print-root">Chưa có dữ liệu in.</div>

  <!-- Mock preview: mở file với ?mock=1 hoặc chạy scripts/mock_print_export.py -->
<script>window.__TRANSFER_PRINT_DATA__ = {"mode": "preview", "__mock": true, "quantity": 9, "part_number": "RC6-1377-000", "part_name": "TN_SP_Holder_L_K2", "cavity": "", "qr_ids": ["RC6-1377-000-20260825-00000001", "RC6-1377-000-20260825-00000002", "RC6-1377-000-20260825-00000003", "RC6-1377-000-20260825-00000004", "RC6-1377-000-20260825-00000005", "RC6-1377-000-20260825-00000006", "RC6-1377-000-20260825-00000007", "RC6-1377-000-20260825-00000008", "RC6-1377-000-20260825-00000009"], "display_codes": ["RC6-1377-000-20260825", "RC6-1377-000-20260825", "RC6-1377-000-20260825", "RC6-1377-000-20260825", "RC6-1377-000-20260825", "RC6-1377-000-20260825", "RC6-1377-000-20260825", "RC6-1377-000-20260825", "RC6-1377-000-20260825"]};</script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      if (params.get("mock") !== "1" && !window.__TRANSFER_PRINT_DATA__) return;
      window.__TRANSFER_PRINT_DATA__ = window.__TRANSFER_PRINT_DATA__ || {
        __mock: true,
        mode: "preview",
        quantity: 9,
        part_number: "RC6-1377-000",
        part_name: "TN_SP_Holder_L_K2",
        cavity: "",
        qr_ids: [
          "RC6-1377-000-20260720-00000001",
          "RC6-1377-000-20260720-00000002",
          "RC6-1377-000-20260720-00000003",
          "RC6-1377-000-20260720-00000004",
          "RC6-1377-000-20260720-00000005",
          "RC6-1377-000-20260720-00000006",
          "RC6-1377-000-20260720-00000007",
          "RC6-1377-000-20260720-00000008",
          "RC6-1377-000-20260720-00000009",
        ],
        display_codes: Array(9).fill("RC6-1377-000-20260720"),
      };
    })();
  </script>

  <script>
    (function () {
      "use strict";

      const LABELS_PER_PAGE = 9;
      const DOCUMENT_CODE = "PR-QĐ01-HD21-R00";
      const UPDATED_DATE = "20-07-2026";

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function qrImageUrl(qrId) {
        return (
          "https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=8&ecc=M&data=" +
          encodeURIComponent(String(qrId ?? ""))
        );
      }

      /**
       * @param {{
       *   quantity?: number,
       *   part_number?: string,
       *   part_name?: string,
       *   cavity?: string,
       *   qr_ids?: string[],
       *   display_codes?: string[]
       * }} data
       */
      function buildLabels(data) {
        const quantity = Math.max(Number(data?.quantity) || 0, 0);
        const partNumber = String(data?.part_number ?? "");
        const partName = String(data?.part_name ?? "");
        const cavity = String(data?.cavity ?? "");
        const qrIds = Array.isArray(data?.qr_ids) ? data.qr_ids : [];
        const displayCodes = Array.isArray(data?.display_codes) ? data.display_codes : [];

        return Array.from({ length: quantity }, (_, index) => ({
          part_number: partNumber,
          part_name: partName,
          cavity: cavity,
          qr_id: String(qrIds[index] ?? ""),
          qr_display: String(displayCodes[index] ?? qrIds[index] ?? ""),
        }));
      }

      function countPages(quantity) {
        const total = Math.max(Number(quantity) || 0, 0);
        return total === 0 ? 0 : Math.ceil(total / LABELS_PER_PAGE);
      }

      function renderTicket(label) {
        const partNumber = escapeHtml(label.part_number);
        const partName = escapeHtml(label.part_name);
        const cavity = escapeHtml(label.cavity);
        const qrDisplay = escapeHtml(label.qr_display);

        return `
          <div class="ticket">
            <div class="ticket-header">
              <div class="ticket-title">
                <h1>Phiếu di chuyển</h1>
              </div>
            </div>

            <div class="ticket-body">
              <div class="row">
                <div class="label">Mã sản phẩm</div>
                <div class="value">${partNumber}</div>
              </div>
              <div class="row">
                <div class="label">Tên sản phẩm</div>
                <div class="value">${partName}</div>
              </div>
              <div class="row">
                <div class="label">Số cavity</div>
                <div class="value">${cavity}</div>
              </div>
              <div class="row">
                <div class="label">Số lượng</div>
                <div class="value"></div>
              </div>
              <div class="row">
                <div class="label">Sản xuất</div>
                <div class="value">…./…./2026</div>
              </div>
              <div class="row">
                <div class="label">Kiểm tra</div>
                <div class="value"></div>
              </div>
              <div class="row">
                <div class="label">Đóng gói</div>
                <div class="value"></div>
              </div>

              <div class="remarks-row">
                <div class="remarks-content">
                  Ghi chú:
                  <div class="remarks-hint">…….h &nbsp;--&gt;&nbsp; ……h</div>
                  <div class="remarks-body"></div>
                </div>
                <div class="ticket-qr">
                  <img src="${qrImageUrl(label.qr_id)}" alt="${qrDisplay}" />
                  <div class="qr-text">${qrDisplay}</div>
                </div>
              </div>

              <div class="meta">
                <span>Updated: ${UPDATED_DATE}</span>
                <span>${DOCUMENT_CODE}</span>
              </div>
            </div>
          </div>
        `;
      }

      function renderPages(labels) {
        if (!labels.length) return "";

        const pages = [];
        for (let i = 0; i < labels.length; i += LABELS_PER_PAGE) {
          const chunk = labels.slice(i, i + LABELS_PER_PAGE);
          pages.push(
            `<div class="sheet-page">${chunk.map(renderTicket).join("")}</div>`,
          );
        }
        return pages.join("");
      }

      function updatePageInfo(labelCount, isMock) {
        const pageInfo = document.getElementById("page-info");
        if (!pageInfo) return;

        if (labelCount === 0) {
          pageInfo.textContent = "Chưa có dữ liệu in";
          return;
        }

        const pages = countPages(labelCount);
        const mockTag = isMock ? " · mock preview" : "";
        pageInfo.textContent =
          `${labelCount} phiếu · ${pages} trang A4 (${LABELS_PER_PAGE} phiếu/trang)${mockTag}`;
      }

      function init(data, options) {
        const isMock = options?.isMock === true;
        const labels = buildLabels(data);
        const html = renderPages(labels);
        const root = document.getElementById("print-root");

        if (root) {
          root.classList.toggle("is-empty", labels.length === 0);
          root.innerHTML = labels.length === 0 ? "Chưa có dữ liệu in." : html;
        }

        updatePageInfo(labels.length, isMock);

        return {
          labels,
          pageCount: countPages(labels.length),
          html,
        };
      }

      window.TransferPrint = {
        LABELS_PER_PAGE,
        DOCUMENT_CODE,
        UPDATED_DATE,
        buildLabels,
        countPages,
        renderTicket,
        renderPages,
        init,
      };

      document
        .getElementById("toolbar-print-btn")
        ?.addEventListener("click", () => window.print());

      if (window.__TRANSFER_PRINT_DATA__) {
        const isMock = window.__TRANSFER_PRINT_DATA__.__mock === true;
        init(window.__TRANSFER_PRINT_DATA__, { isMock });
      }
    })();
  </script>
</body>
</html>
