<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>In QR — kho manual (3×5cm)</title>
  <!--
    Template in QR cho kho MANUAL — nhãn 30×50mm.
    qr_type=item (phiếu thành phẩm): mã sản phẩm (part_number) + QR.
    qr_type=pack|transit: chỉ có QR (không có dòng ghi tay).

    Backend truyền dữ liệu qua window.__QR_LABEL_MANUAL_PRINT_DATA__
    rồi gọi QrLabelManualPrint.init().

    Payload:
    {
      "mode": "preview",
      "item_id": 1,
      "quantity": 30,
      "part_number": "SKU-001",
      "qr_ids": ["..."],
      "display_codes": ["..."],
      "qr_type": "item" | "pack" | "transit"
    }

    Khổ A4 (vùng in ~194×281mm): lưới 6 cột × 5 hàng = 30 nhãn/trang.
  -->
  <style>
    :root {
      --page-width: 194mm;
      --page-height: 281mm;
      --page-margin: 7mm;
      --label-width: 30mm;
      --label-height: 50mm;
      --label-cols: 6;
      --label-rows: 5;
      --labels-per-page: 30;
      --sheet-padding: 2mm;
      --sheet-gap: 2mm;
    }

    @page {
      size: A4 portrait;
      margin: var(--page-margin);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 8mm;
      font-family: "Times New Roman", Times, serif;
      color: #000;
      background: #f3f4f6;
    }

    .toolbar {
      max-width: calc(var(--page-width) + 16mm);
      margin: 0 auto 6mm;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #475569;
    }

    .toolbar button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
    }

    .print-root {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10mm;
    }

    .print-root.is-empty {
      min-height: 40mm;
      justify-content: center;
      color: #64748b;
      font-size: 14px;
    }

    .sheet-page {
      width: var(--page-width);
      height: var(--page-height);
      background: #fff;
      padding: var(--sheet-padding);
      display: grid;
      grid-template-columns: repeat(var(--label-cols), var(--label-width));
      grid-template-rows: repeat(var(--label-rows), var(--label-height));
      gap: var(--sheet-gap);
      justify-content: center;
      align-content: start;
      page-break-after: always;
      break-after: page;
    }

    .sheet-page:last-child {
      page-break-after: auto;
      break-after: auto;
    }

    .qr-label {
      width: var(--label-width);
      height: var(--label-height);
      border: 0.4mm solid #000;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1mm;
      overflow: hidden;
      page-break-inside: avoid;
      break-inside: avoid;
      position: relative;
    }

    .qr-type-badge {
      position: absolute;
      top: 0.6mm;
      right: 0.8mm;
      font-size: 6px;
      font-weight: 700;
      line-height: 1;
    }

    .qr-part-number {
      position: absolute;
      z-index: 2;
      top: 2.8mm;
      left: 1mm;
      right: 1mm;
      padding: 0 0.5mm;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.12;
      text-align: center;
      word-break: break-all;
      overflow: hidden;
      max-height: 12mm;
      pointer-events: none;
    }

    .qr-label-image {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-label-image img {
      width: 100%;
      height: 100%;
      max-width: 26mm;
      max-height: 44mm;
      object-fit: contain;
      display: block;
    }

    /* Phiếu thành phẩm: chữ nổi trên, QR giữ nguyên kích thước & căn giữa nhãn */
    .qr-label.has-part-number .qr-label-image {
      position: absolute;
      inset: 1mm;
      flex: none;
      min-height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-label.has-part-number .qr-label-image img {
      max-width: 26mm;
      max-height: 44mm;
    }

    @media print {
      body {
        padding: 0;
        background: #fff;
      }
      .toolbar { display: none; }
      .print-root { gap: 0; }
      .print-root.is-empty { display: none; }
      .sheet-page {
        box-shadow: none;
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span id="page-info">Chưa có dữ liệu in</span>
    <button type="button" id="toolbar-print-btn">In / Lưu PDF</button>
  </div>

  <div class="print-root is-empty" id="print-root">Chưa có dữ liệu in.</div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      if (params.get("mock") !== "1" && !window.__QR_LABEL_MANUAL_PRINT_DATA__) return;
      window.__QR_LABEL_MANUAL_PRINT_DATA__ = window.__QR_LABEL_MANUAL_PRINT_DATA__ || {
        __mock: true,
        mode: "preview",
        item_id: 1,
        quantity: 30,
        part_number: "BGRD00074",
        qr_ids: Array.from({ length: 30 }, (_, i) => `BGRD00074-20260101-${String(i + 1).padStart(8, "0")}`),
        display_codes: Array(30).fill("BGRD00074-20260101"),
        qr_type: "item",
      };
    })();
  </script>

  <script>
    (function () {
      "use strict";

      const LABELS_PER_PAGE = 30;
      const LABEL_COLS = 6;
      const LABEL_ROWS = 5;

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function qrImageUrl(qrId) {
        return (
          "https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=6&ecc=M&data=" +
          encodeURIComponent(String(qrId ?? ""))
        );
      }

      function qrTypeBadge(qrType) {
        const normalized = String(qrType ?? "item").trim().toLowerCase();
        if (normalized === "item") return "1";
        if (normalized === "pack") return "2";
        if (normalized === "transit") return "DC";
        return "";
      }

      function buildLabels(data) {
        const quantity = Math.max(Number(data?.quantity) || 0, 0);
        const qrIds = Array.isArray(data?.qr_ids) ? data.qr_ids : [];
        const qrType = String(data?.qr_type ?? "item");
        const partNumber = String(data?.part_number ?? "").trim();
        const showPartNumber =
          qrType.trim().toLowerCase() === "item" && partNumber.length > 0;

        return Array.from({ length: quantity }, (_, index) => ({
          qr_id: String(qrIds[index] ?? ""),
          qr_type: qrType,
          part_number: showPartNumber ? partNumber : "",
        }));
      }

      function countPages(quantity) {
        const total = Math.max(Number(quantity) || 0, 0);
        return total === 0 ? 0 : Math.ceil(total / LABELS_PER_PAGE);
      }

      function renderLabel(label) {
        const badge = escapeHtml(qrTypeBadge(label.qr_type));
        const badgeHtml = badge
          ? `<span class="qr-type-badge">${badge}</span>`
          : "";
        const partNumber = String(label.part_number ?? "").trim();
        const partNumberHtml = partNumber
          ? `<div class="qr-part-number">${escapeHtml(partNumber)}</div>`
          : "";
        const labelClass = partNumber ? "qr-label has-part-number" : "qr-label";

        return `
          <div class="${labelClass}">
            ${badgeHtml}
            ${partNumberHtml}
            <div class="qr-label-image">
              <img src="${qrImageUrl(label.qr_id)}" alt="QR" />
            </div>
          </div>
        `;
      }

      function renderPages(labels) {
        if (!labels.length) return "";

        const pages = [];
        for (let i = 0; i < labels.length; i += LABELS_PER_PAGE) {
          const chunk = labels.slice(i, i + LABELS_PER_PAGE);
          pages.push(
            `<div class="sheet-page">${chunk.map(renderLabel).join("")}</div>`,
          );
        }
        return pages.join("");
      }

      function updatePageInfo(labelCount) {
        const pageInfo = document.getElementById("page-info");
        if (!pageInfo) return;

        if (labelCount === 0) {
          pageInfo.textContent = "Chưa có dữ liệu in";
          return;
        }

        pageInfo.textContent =
          `${labelCount} nhãn QR · ${countPages(labelCount)} trang A4 (${LABELS_PER_PAGE}/trang, nhãn 30×50mm, kho manual)`;
      }

      function init(data) {
        const labels = buildLabels(data);
        const html = renderPages(labels);
        const root = document.getElementById("print-root");

        if (root) {
          root.classList.toggle("is-empty", labels.length === 0);
          root.innerHTML = labels.length === 0 ? "Chưa có dữ liệu in." : html;
        }

        updatePageInfo(labels.length);

        return {
          labels,
          pageCount: countPages(labels.length),
          html,
        };
      }

      window.QrLabelManualPrint = {
        LABELS_PER_PAGE,
        LABEL_COLS,
        LABEL_ROWS,
        buildLabels,
        countPages,
        renderLabel,
        renderPages,
        init,
      };

      function handleToolbarPrint() {
        const data = window.__QR_LABEL_MANUAL_PRINT_DATA__;
        if (data?.mode === "preview" && window.parent && window.parent !== window) {
          window.parent.postMessage(
            {
              type: "bacviet-qr-print",
              item_id: data.item_id,
              quantity: data.quantity,
              qr_ids: data.qr_ids,
              display_codes: data.display_codes,
              qr_type: data.qr_type || "item",
            },
            "*",
          );
          return;
        }
        window.print();
      }

      document
        .getElementById("toolbar-print-btn")
        ?.addEventListener("click", handleToolbarPrint);

      if (window.__QR_LABEL_MANUAL_PRINT_DATA__) {
        init(window.__QR_LABEL_MANUAL_PRINT_DATA__);
      }
    })();
  </script>
</body>
</html>
