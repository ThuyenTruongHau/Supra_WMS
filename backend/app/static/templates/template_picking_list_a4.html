<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Phiếu lấy hàng - Picking List A4</title>
  <!--
    Template in Picking List A4 ngang — 1 phiếu / trang (bảng chi tiết, phân trang khi nhiều dòng).

    Backend / FE truyền dữ liệu qua window.__PICKING_LIST_PRINT_DATA__ rồi gọi PickingListPrint.init().

    Payload:
    {
      "vehicle_number": "51F-123.45",
      "assigned_location": "CC23",
      "zone": "Zone_CC_02",
      "printed_at": "16/10/2026",
      "extracted": 1,
      "form_code": "Pallet 1",
      "sheets": [
        {
          "customer_name": "WinMart+ Q.1",
          "nvt": "NVT01, NVT02",
          "trip": "T01, T02",
          "lines": [
            { "sku", "item_name", "quantity", "unit", "lot_number", "locator" }
          ]
        }
      ]
    }

    Mỗi sheet = một khách; phân trang global ROWS_PER_PAGE; chữ ký trang cuối PDF.
    In PDF: Scale 100%, margin theo @page.
  -->
  <style>
    :root {
      --page-width: 281mm;
      --page-height: 194mm;
      --page-margin: 7mm;
      --sheet-padding: 5mm 7mm;
      --rows-per-page: 12;
      --font-base: 13px;
      --font-small: 11px;
      --font-meta: 16px;
      --font-meta-value: 18px;
      --font-table: 11px;
      --font-table-head: 11px;
      --border: 1px solid #000;
    }

    @page {
      size: A4 landscape;
      margin: var(--page-margin);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 8mm;
      font-family: "Times New Roman", Times, serif;
      font-size: var(--font-base);
      color: #000;
      background: #f3f4f6;
    }

    .toolbar {
      max-width: calc(var(--page-width) + 16mm);
      margin: 0 auto 6mm;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      color: #475569;
    }

    .toolbar button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
    }

    .print-root {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10mm;
    }

    .print-root.is-empty {
      min-height: 40mm;
      justify-content: center;
      color: #64748b;
      font-size: 14px;
      font-family: system-ui, sans-serif;
    }

    .sheet-page {
      width: var(--page-width);
      height: var(--page-height);
      min-height: var(--page-height);
      background: #fff;
      padding: var(--sheet-padding);
      display: flex;
      flex-direction: column;
      page-break-after: always;
      break-after: page;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .sheet-page:last-child {
      page-break-after: auto;
      break-after: auto;
    }

    .doc-header {
      text-align: center;
      margin-bottom: 4mm;
      border-bottom: 2px solid #000;
      padding-bottom: 3mm;
    }

    .doc-header h1 {
      margin: 0 0 0.5mm;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .doc-header p {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      font-style: italic;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5mm 6mm;
      margin-bottom: 3mm;
      font-size: var(--font-meta);
      font-weight: 700;
      text-align: center;
    }

    .meta-row {
      display: flex;
      gap: 2mm;
      align-items: center;
      justify-content: center;
    }

    .meta-row .label {
      font-weight: 700;
      white-space: nowrap;
    }

    .meta-row .value {
      border-bottom: 1px dotted #666;
      min-height: 1.2em;
      font-weight: 700;
      font-size: var(--font-meta-value);
    }

    .meta-row--span {
      grid-column: 1 / -1;
    }

    .sheet-page--customer-start {
      page-break-before: always;
      break-before: page;
    }

    .sheet-body {
      flex: 1;
      min-height: 0;
    }

    .lines-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .lines-table--fill {
      height: 100%;
    }

    .lines-table th,
    .lines-table td {
      border: var(--border);
      padding: 1.6mm 0.8mm;
      vertical-align: top;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      font-size: var(--font-table);
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .lines-table th {
      background: #f0f0f0;
      font-size: var(--font-table-head);
      font-weight: 700;
      text-transform: uppercase;
      padding: 1.8mm 0.6mm;
    }

    .lines-table td.sku {
      font-family: "Courier New", Courier, monospace;
      font-size: var(--font-table);
      letter-spacing: -0.01em;
    }

    .lines-table tbody tr {
      page-break-inside: avoid;
      break-inside: avoid;
    }

    /* Dòng có dữ liệu: cao theo nội dung; dòng trống pad: hấp thụ phần cao còn lại của bảng. */
    .lines-table tbody tr.row-data {
      height: 1px;
    }

    .lines-table tbody tr.row-data td {
      height: auto;
    }

    .lines-table tbody tr.row-filler td {
      vertical-align: middle;
    }

    .col-stt { width: 5%; }
    .col-sku { width: 12%; }
    .col-name { width: 28%; }
    .col-lot { width: 10%; }
    .col-qty { width: 7%; }
    .col-unit { width: 8%; }
    .col-locator { width: 30%; }

    .sheet-footer {
      margin-top: auto;
      padding-top: 4mm;
      display: flex;
      align-items: flex-end;
      font-size: var(--font-small);
      font-weight: 700;
    }

    .sheet-footer--compact {
      justify-content: center;
    }

    .sheet-footer--last {
      justify-content: flex-start;
      gap: 4mm;
    }

    .sheet-footer--last .page-num {
      flex: 1;
      text-align: center;
    }

    .sign-block {
      width: 30%;
      text-align: center;
      flex-shrink: 0;
    }

    .sign-block .title {
      font-weight: 700;
      margin-bottom: 10mm;
      font-size: var(--font-base);
    }

    .sign-line {
      border-top: 1px solid #000;
      margin-top: 0;
      padding-top: 1mm;
      font-size: var(--font-small);
    }

    .page-num {
      text-align: center;
      font-size: var(--font-small);
      color: #333;
    }

    @media print {
      body {
        padding: 0;
        background: #fff;
      }
      .toolbar { display: none; }
      .print-root { gap: 0; }
      .print-root.is-empty { display: none; }
      .sheet-page {
        box-shadow: none;
        margin: 0;
        height: var(--page-height);
        min-height: var(--page-height);
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span id="page-info">Chưa có dữ liệu in</span>
    <button type="button" id="toolbar-print-btn">In / Lưu PDF</button>
  </div>

  <div class="print-root is-empty" id="print-root">Chưa có dữ liệu in.</div>

  <script>
    window.__PICKING_LIST_PRINT_DATA__ = {
      __mock: true,
      mode: "preview",
      vehicle_number: "51F-123.45",
      assigned_location: "CC23",
      zone: "Zone_CC_02",
      extracted: 1,
      form_code: "Pallet 1",
      sheets: [
        {
          customer_name: "WinMart+ Q.1",
          nvt: "NVT01",
          trip: "T01, T02",
          lines: [
            {
              sku: "02KK00361",
              item_name: "Omachi sườn hầm 92g x 30 gói",
              quantity: 120,
              unit: "Thùng",
              lot_number: "040526",
              locator: "R01-L05",
            },
            {
              sku: "01PH00073",
              item_name: "Phở Omachi bò 75g x 30",
              quantity: 200,
              unit: "Thùng",
              lot_number: "060526",
              locator: "R02-L01",
            },
          ],
        },
        {
          customer_name: "Co.opmart Bình Thạnh",
          nvt: "NVT02",
          trip: "T01, T03",
          lines: [
            {
              sku: "02OM00858",
              item_name: "Mì Omachi bò hầm 80g x 30",
              quantity: 75,
              unit: "Thùng",
              lot_number: "050526",
              locator: "R01-L06",
            },
            {
              sku: "02KK00500",
              item_name: "Omachi chua cay Hàn Quốc 95g x 30",
              quantity: 36,
              unit: "Thùng",
              lot_number: "080526",
              locator: "R03-L01",
            },
          ],
        },
      ],
    };
  </script>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      if (params.get("mock") !== "1" && !window.__PICKING_LIST_PRINT_DATA__) return;
      window.__PICKING_LIST_PRINT_DATA__ = window.__PICKING_LIST_PRINT_DATA__ || {
        __mock: true,
        mode: "preview",
        vehicle_number: "51F-123.45",
        assigned_location: "CC23",
        zone: "Zone_CC_02",
        lines: [],
      };
    })();
  </script>

  <!--
    BACKEND (ví dụ inject):
    <script>window.__PICKING_LIST_PRINT_DATA__ = {{ payload | tojson }};</script>
  -->

  <script>
    (function () {
      "use strict";

      const ROWS_PER_PAGE = 12;
      const DOCUMENT_CODE_FALLBACK = "Pallet —";

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function formatTodayVi() {
        const d = new Date();
        const dd = String(d.getDate()).padStart(2, "0");
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const yyyy = d.getFullYear();
        return `${dd}/${mm}/${yyyy}`;
      }

      function displayText(value) {
        const s = String(value ?? "").trim();
        return s ? escapeHtml(s) : "—";
      }

      function displayQty(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) return "—";
        if (Number.isInteger(n)) return String(n);
        return n.toLocaleString("vi-VN", { maximumFractionDigits: 3 });
      }

      function normalizeLineRow(row, stt) {
        return {
          stt,
          sku: String(row?.sku ?? "").trim(),
          item_name: String(row?.item_name ?? "").trim(),
          quantity: row?.quantity,
          unit: String(row?.unit ?? "").trim(),
          lot_number: String(row?.lot_number ?? "").trim(),
          locator: String(row?.locator ?? "").trim(),
        };
      }

      function uniqueKeepOrder(values) {
        const seen = new Set();
        const out = [];
        for (const raw of values) {
          const cleaned = String(raw ?? "").trim();
          if (!cleaned || seen.has(cleaned)) continue;
          seen.add(cleaned);
          out.push(cleaned);
        }
        return out;
      }

      function normalizeSheet(rawSheet) {
        const rawLines = Array.isArray(rawSheet?.lines) ? rawSheet.lines : [];
        return {
          customer_name: String(rawSheet?.customer_name ?? "").trim(),
          nvt: String(rawSheet?.nvt ?? "").trim(),
          trip: String(rawSheet?.trip ?? "").trim(),
          lines: rawLines.map((row, index) => normalizeLineRow(row, index + 1)),
        };
      }

      function legacySheetsFromFlatLines(lines) {
        if (!lines.length) return [];
        const nvts = [];
        const trips = [];
        let customerName = "";
        for (const row of lines) {
          if (!customerName) {
            customerName = String(row?.customer_name ?? "").trim();
          }
          const nvt = String(row?.nvt ?? "").trim();
          if (nvt) nvts.push(nvt);
          const trip = String(row?.trip ?? "").trim();
          if (trip) trips.push(trip);
        }
        return [
          {
            customer_name: customerName,
            nvt: uniqueKeepOrder(nvts).join(", "),
            trip: uniqueKeepOrder(trips).join(", "),
            lines: lines.map((row, index) =>
              normalizeLineRow(row, index + 1),
            ),
          },
        ];
      }

      /**
       * @param {object} data
       */
      function normalizePayload(data) {
        const extractedRaw = data?.extracted;
        const extractedNum = Number(extractedRaw);
        const formFromBatch =
          Number.isFinite(extractedNum) && extractedNum > 0
            ? `Pallet ${Math.trunc(extractedNum)}`
            : "";
        const formCode =
          String(data?.form_code ?? "").trim() || formFromBatch;

        let sheets = Array.isArray(data?.sheets)
          ? data.sheets.map(normalizeSheet)
          : [];
        if (!sheets.length) {
          const legacyLines = Array.isArray(data?.lines) ? data.lines : [];
          sheets = legacySheetsFromFlatLines(legacyLines);
        }

        return {
          vehicle_number: String(data?.vehicle_number ?? "").trim(),
          assigned_location: String(data?.assigned_location ?? "").trim(),
          zone: String(data?.zone ?? "").trim(),
          printed_at: String(data?.printed_at ?? "").trim() || formatTodayVi(),
          form_code: formCode,
          sheets,
        };
      }

      function payloadLineCount(payload) {
        return (payload.sheets ?? []).reduce(
          (total, sheet) => total + (sheet.lines?.length ?? 0),
          0,
        );
      }

      function metaCcLabel(payload) {
        const loc = String(payload.assigned_location ?? "").trim();
        const zone = String(payload.zone ?? "").trim();
        if (loc && zone && !loc.includes(zone)) {
          return `${loc} · ${zone}`;
        }
        return loc || zone;
      }

      function renderMeta(payload, sheet) {
        return `
          <div class="meta-grid">
            <div class="meta-row">
              <span class="label">Biển số xe:</span>
              <span class="value">${displayText(payload.vehicle_number)}</span>
            </div>
            <div class="meta-row">
              <span class="label">Ngày:</span>
              <span class="value">${displayText(payload.printed_at)}</span>
            </div>
            <div class="meta-row">
              <span class="label">Ô CC:</span>
              <span class="value">${displayText(metaCcLabel(payload))}</span>
            </div>
            <div class="meta-row">
              <span class="label">Mã biểu mẫu:</span>
              <span class="value">${displayText(payload.form_code || DOCUMENT_CODE_FALLBACK)}</span>
            </div>
            <div class="meta-row">
              <span class="label">Khách hàng:</span>
              <span class="value">${displayText(sheet.customer_name)}</span>
            </div>
            <div class="meta-row">
              <span class="label">NVT:</span>
              <span class="value">${displayText(sheet.nvt)}</span>
            </div>
            <div class="meta-row meta-row--span">
              <span class="label">Trip:</span>
              <span class="value">${displayText(sheet.trip)}</span>
            </div>
          </div>
        `;
      }

      function renderTableHead() {
        return `
          <thead>
            <tr>
              <th class="col-stt">STT</th>
              <th class="col-sku">Mã hàng</th>
              <th class="col-name">Tên hàng</th>
              <th class="col-lot">Số lô</th>
              <th class="col-qty">SL</th>
              <th class="col-unit">ĐVT</th>
              <th class="col-locator">Locator</th>
            </tr>
          </thead>
        `;
      }

      function renderEmptyTableRow() {
        return `<tr class="row-filler"><td class="num">&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
      }

      function renderTableRow(row) {
        return `
          <tr class="row-data">
            <td class="num">${row.stt}</td>
            <td class="sku">${displayText(row.sku)}</td>
            <td>${displayText(row.item_name)}</td>
            <td class="num">${displayText(row.lot_number)}</td>
            <td class="qty">${displayQty(row.quantity)}</td>
            <td class="num">${displayText(row.unit)}</td>
            <td>${displayText(row.locator)}</td>
          </tr>
        `;
      }

      function renderFooter(pageIndex, pageCount, isLastPage) {
        const pageLabel = `<div class="page-num">Trang ${pageIndex + 1} / ${pageCount}</div>`;
        if (!isLastPage) {
          return `<footer class="sheet-footer sheet-footer--compact">${pageLabel}</footer>`;
        }
        return `
          <footer class="sheet-footer sheet-footer--last">
            <div class="sign-block">
              <div class="title">Người chia hàng</div>
              <div class="sign-line">&nbsp;</div>
            </div>
            ${pageLabel}
          </footer>
        `;
      }

      function renderPage(
        payload,
        sheet,
        chunk,
        pageIndex,
        pageCount,
        isLastPage,
        isCustomerStart,
      ) {
        const rowsHtml = chunk.map(renderTableRow).join("");
        const fillerCount = Math.max(0, ROWS_PER_PAGE - chunk.length);
        const fillerRows =
          fillerCount > 0
            ? Array.from({ length: fillerCount }, renderEmptyTableRow).join("")
            : "";
        const pageClass = isCustomerStart
          ? "sheet-page sheet-page--customer-start"
          : "sheet-page";

        return `
          <div class="${pageClass}">
            <header class="doc-header">
              <h1>Phiếu lấy hàng</h1>
              <p>Picking List</p>
            </header>
            ${renderMeta(payload, sheet)}
            <div class="sheet-body">
              <table class="lines-table${fillerCount ? " lines-table--fill" : ""}">
                ${renderTableHead()}
                <tbody>${rowsHtml}${fillerRows}</tbody>
              </table>
            </div>
            ${renderFooter(pageIndex, pageCount, isLastPage)}
          </div>
        `;
      }

      function buildPageJobs(payload) {
        const jobs = [];
        const sheets = payload.sheets ?? [];
        for (let sheetIndex = 0; sheetIndex < sheets.length; sheetIndex++) {
          const sheet = sheets[sheetIndex];
          const lines = sheet.lines ?? [];
          for (let i = 0; i < lines.length; i += ROWS_PER_PAGE) {
            jobs.push({
              sheet,
              chunk: lines.slice(i, i + ROWS_PER_PAGE),
              isCustomerStart: sheetIndex > 0 && i === 0,
            });
          }
        }
        return jobs;
      }

      function renderPages(payload) {
        const jobs = buildPageJobs(payload);
        if (!jobs.length) return "";

        const pageCount = jobs.length;
        return jobs
          .map((job, pageIndex) =>
            renderPage(
              payload,
              job.sheet,
              job.chunk,
              pageIndex,
              pageCount,
              pageIndex === pageCount - 1,
              job.isCustomerStart,
            ),
          )
          .join("");
      }

      function countPagesForPayload(payload) {
        return buildPageJobs(payload).length;
      }

      function updatePageInfo(payload) {
        const pageInfo = document.getElementById("page-info");
        if (!pageInfo) return;
        const lineCount = payloadLineCount(payload);
        if (lineCount === 0) {
          pageInfo.textContent = "Chưa có dữ liệu in";
          return;
        }
        const sheetCount = payload.sheets?.length ?? 0;
        const pages = countPagesForPayload(payload);
        pageInfo.textContent =
          `${sheetCount} khách · ${lineCount} dòng · ${pages} trang A4 ngang (${ROWS_PER_PAGE} dòng/trang)`;
      }

      /**
       * @param {object} data
       * @returns {{ payload: object, pageCount: number, html: string }}
       */
      function init(data) {
        const payload = normalizePayload(data || {});
        const html = renderPages(payload);
        const root = document.getElementById("print-root");

        const lineCount = payloadLineCount(payload);
        if (root) {
          root.classList.toggle("is-empty", lineCount === 0);
          root.innerHTML =
            lineCount === 0 ? "Chưa có dữ liệu in." : html;
        }

        updatePageInfo(payload);

        return {
          payload,
          pageCount: countPagesForPayload(payload),
          html,
        };
      }

      window.PickingListPrint = {
        ROWS_PER_PAGE,
        DOCUMENT_CODE_FALLBACK,
        normalizePayload,
        renderPages,
        init,
      };

      function handleToolbarPrint() {
        window.print();
      }

      document
        .getElementById("toolbar-print-btn")
        ?.addEventListener("click", handleToolbarPrint);

      if (window.__PICKING_LIST_PRINT_DATA__) {
        init(window.__PICKING_LIST_PRINT_DATA__);
      }
    })();
  </script>
</body>
</html>
