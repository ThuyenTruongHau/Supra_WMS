<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>In QR nhập hàng</title>
  <!--
    Nhãn QR từ file nhập hàng. Cùng khổ template kho nguyên liệu (90×90mm, 6 nhãn/A4)
    nhưng không có logo. Dưới QR: mã hàng, số lượng, LOT, NVT.

    Backend truyền dữ liệu qua window.__INBOUND_QR_PRINT_DATA__
    rồi gọi InboundQrPrint.init().

    Payload:
    {
      "labels": [
        {
          "qr_data": "SKU-20261102-00000001",
          "sku": "SKU",
          "quantity": 10,
          "lot": "LOT1",
          "nvt": "NVT"
        }
      ]
    }

    Số trang = Math.ceil(labels.length / 6) — lưới 2×3 trên A4.
  -->
  <style>
    :root {
      --page-width: 194mm;
      --page-height: 281mm;
      --page-margin: 7mm;
      --sheet-padding: 4mm;
      --label-size: 90mm;
      --label-cols: 2;
      --label-rows: 3;
      --sheet-gap: 3mm;
      --labels-per-page: 6;
    }

    @page {
      size: A4 portrait;
      margin: var(--page-margin);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 8mm;
      font-family: "Times New Roman", Times, serif;
      color: #000;
      background: #f3f4f6;
    }

    .toolbar {
      max-width: calc(var(--page-width) + 16mm);
      margin: 0 auto 6mm;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #475569;
    }

    .toolbar button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
    }

    .print-root {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10mm;
    }

    .print-root.is-empty {
      min-height: 40mm;
      justify-content: center;
      color: #64748b;
      font-size: 14px;
    }

    .sheet-page {
      width: var(--page-width);
      height: var(--page-height);
      background: #fff;
      padding: var(--sheet-padding);
      display: grid;
      grid-template-columns: repeat(var(--label-cols), var(--label-size));
      grid-template-rows: repeat(var(--label-rows), var(--label-size));
      gap: var(--sheet-gap);
      justify-content: center;
      align-content: center;
      page-break-after: always;
      break-after: page;
    }

    .sheet-page:last-child {
      page-break-after: auto;
      break-after: auto;
    }

    .qr-slot {
      width: var(--label-size);
      height: var(--label-size);
      display: flex;
      flex-direction: column;
      page-break-inside: avoid;
      break-inside: avoid;
      overflow: hidden;
      border: 3px solid #000;
      padding: 2mm;
    }

    .qr-slot.is-empty {
      visibility: hidden;
      border: none;
    }

    .qr-body {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1mm;
    }

    .qr-image {
      width: 100%;
      height: 100%;
      max-width: 58mm;
      max-height: 58mm;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .qr-meta {
      flex-shrink: 0;
      padding-top: 1mm;
      font-size: 12px;
      line-height: 1.25;
      text-align: center;
    }

    .qr-meta div {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .qr-meta span {
      font-weight: 700;
    }

    @media print {
      body {
        padding: 0;
        background: #fff;
      }
      .toolbar { display: none; }
      .print-root { gap: 0; }
      .print-root.is-empty { display: none; }
      .sheet-page {
        box-shadow: none;
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span id="page-info">Chưa có dữ liệu in</span>
    <button type="button" id="toolbar-print-btn">In / Lưu PDF</button>
  </div>

  <div class="print-root is-empty" id="print-root">Chưa có dữ liệu in.</div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      if (params.get("mock") !== "1" && !window.__INBOUND_QR_PRINT_DATA__) return;
      window.__INBOUND_QR_PRINT_DATA__ = window.__INBOUND_QR_PRINT_DATA__ || {
        __mock: true,
        labels: [
          {
            qr_data: "SKU-001-20261102-00000001",
            sku: "SKU-001",
            quantity: 12,
            lot: "L001",
            nvt: "NVT-A",
          },
        ],
      };
    })();
  </script>

  <script>
    (function () {
      "use strict";

      const LABELS_PER_PAGE = 6;

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function qrImageUrl(qrData) {
        return (
          "https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=12&ecc=M&data=" +
          encodeURIComponent(String(qrData ?? ""))
        );
      }

      function buildLabels(data) {
        const labels = Array.isArray(data?.labels) ? data.labels : [];
        return labels.map((label) => ({
          qr_data: String(label?.qr_data ?? ""),
          sku: String(label?.sku ?? ""),
          quantity: label?.quantity ?? "",
          lot: String(label?.lot ?? ""),
          nvt: String(label?.nvt ?? ""),
        }));
      }

      function countPages(labelCount) {
        const total = Math.max(Number(labelCount) || 0, 0);
        return total === 0 ? 0 : Math.ceil(total / LABELS_PER_PAGE);
      }

      function renderSlot(label) {
        if (!label) {
          return `<div class="qr-slot is-empty" aria-hidden="true"></div>`;
        }

        const sku = escapeHtml(label.sku);
        const quantity = escapeHtml(label.quantity);
        const lot = escapeHtml(label.lot);
        const nvt = escapeHtml(label.nvt);

        return `
          <div class="qr-slot">
            <div class="qr-body">
              <div class="qr-image">
                <img src="${qrImageUrl(label.qr_data)}" alt="${sku}" />
              </div>
            </div>
            <div class="qr-meta">
              <div><span>Mã hàng:</span> ${sku}</div>
              <div><span>Số lượng:</span> ${quantity}</div>
              <div><span>LOT:</span> ${lot}</div>
              <div><span>NVT:</span> ${nvt}</div>
            </div>
          </div>
        `;
      }

      function renderPages(labels) {
        if (!labels.length) return "";

        const pages = [];
        for (let i = 0; i < labels.length; i += LABELS_PER_PAGE) {
          const chunk = labels.slice(i, i + LABELS_PER_PAGE);
          while (chunk.length < LABELS_PER_PAGE) {
            chunk.push(null);
          }
          pages.push(`
            <div class="sheet-page">
              ${chunk.map(renderSlot).join("")}
            </div>
          `);
        }
        return pages.join("");
      }

      function updatePageInfo(labelCount, isMock) {
        const pageInfo = document.getElementById("page-info");
        if (!pageInfo) return;

        if (labelCount === 0) {
          pageInfo.textContent = "Chưa có dữ liệu in";
          return;
        }

        const pages = countPages(labelCount);
        const mockTag = isMock ? " · mock preview" : "";
        pageInfo.textContent =
          `${labelCount} mã QR · ${pages} trang A4 (${LABELS_PER_PAGE}/trang)${mockTag}`;
      }

      function init(data, options) {
        const isMock = options?.isMock === true;
        const labels = buildLabels(data);
        const html = renderPages(labels);
        const root = document.getElementById("print-root");

        if (root) {
          root.classList.toggle("is-empty", labels.length === 0);
          root.innerHTML = labels.length === 0 ? "Chưa có dữ liệu in." : html;
        }

        updatePageInfo(labels.length, isMock);

        return {
          labels,
          pageCount: countPages(labels.length),
          html,
        };
      }

      window.InboundQrPrint = {
        LABELS_PER_PAGE,
        buildLabels,
        countPages,
        renderSlot,
        renderPages,
        init,
      };

      document
        .getElementById("toolbar-print-btn")
        ?.addEventListener("click", () => window.print());

      if (window.__INBOUND_QR_PRINT_DATA__) {
        const isMock = window.__INBOUND_QR_PRINT_DATA__.__mock === true;
        init(window.__INBOUND_QR_PRINT_DATA__, { isMock });
      }
    })();
  </script>
</body>
</html>
